
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair ZIP
        run: |
          unzip -q Download.zip -d projeto

      - name: Compilar APK
        run: |
          GRADLEW="$(find projeto -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew nao encontrado no ZIP"
            exit 1
          fi

          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
